# Heltec WiFi LoRa 32 V3 - Lora Base Station LoRa Gateway
# Receives CubeCell mailbox sensor packets
# Integrates with Home Assistant MQTT

esphome:
  name: lora-base-station
  friendly_name: Lora Base Station

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Fallback hotspot (for setup)
  ap:
    ssid: !secret fallback_wifi_ssid
    password: !secret fallback_wifi_password

# Captive portal for WiFi setup
captive_portal:

# OTA Updates
ota:
  - platform: esphome
    password: !secret ota_password

# API for Home Assistant
api:
  encryption:
    key: !secret api_encryption_key

logger:
  level: DEBUG  # Set to INFO after testing
  hardware_uart: UART0
  baud_rate: 115200

# SPI Bus for SX1262 LoRa
spi:
  id: spi0
  clk_pin: GPIO9      # SCK
  mosi_pin: GPIO10    # MOSI
  miso_pin: GPIO11    # MISO

# SX1262 LoRa Configuration (MATCHES CUBECELL)
sx126x:
  id: lora_radio
  spi_id: spi0
  cs_pin: GPIO8       # Chip Select
  dio1_pin: GPIO14    # DIO1 (IRQ)
  rst_pin: GPIO12     # Reset
  busy_pin: GPIO13    # Busy
  frequency: 868MHz   # 868 MHz (Italy)
  hw_version: sx1262  # Hardware version (REQUIRED)
  modulation: LORA    # LoRa modulation (REQUIRED)
  rf_switch: false     # DIO2 controls RF switch (REQUIRED)
  bandwidth: 125_0kHz # 125 kHz (matches CubeCell)
  spreading_factor: 8 # SF8 (matches CubeCell)
  coding_rate: CR_4_8 # CR4/8 (matches CubeCell)
  preamble_size: 8    # Preamble size (MUST match CubeCell!)
  sync_value: [0x14, 0x24]  # Private network sync word (explicitly set to match CubeCell)
  pa_power: 21        # Power amplifier setting
  rx_start: true      # Start receiver on boot
  crc_enable: true    # Enable CRC checking
  payload_length: 0   # Variable length packets (explicit header)
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  
  # Packet receive handler
  on_packet:
    then:
      - lambda: |-
          ESP_LOGD("lora", "Packet received: size=%d RSSI=%.1f dBm SNR=%.1f dB", x.size(), rssi, snr);
          // CubeCell packet format: [ID=0x01][Type=0x01][Hatch][Door][Battery]
          if (x.size() >= 5 && x[0] == 0x01 && x[1] == 0x01) {
            bool hatch_open = x[2];
            bool door_open = x[3];
            uint8_t battery = x[4];
            
            // Log received packet
            ESP_LOGD("lora", "Lora Base Station: Hatch=%s Door=%s Batt=%d%% RSSI=%.1fdBm SNR=%.1fdB", 
                     hatch_open ? "OPEN" : "CLOSED",
                     door_open ? "OPEN" : "CLOSED", 
                     battery, rssi, snr);
            
            // MQTT publish — combined JSON (booleans for hatch/door)
            id(mqtt0).publish("lora/mailbox", str_sprintf(
              "{\"hatch\":%s,\"door\":%s,\"battery\":%d,\"rssi\":%.1f,\"snr\":%.1f}",
              hatch_open ? "true" : "false",
              door_open ? "true" : "false",
              battery, rssi, snr).c_str());
          } else {
            // Log unknown packet
            ESP_LOGW("lora", "Unknown packet received (size=%d)", x.size());
          }

# Time for logging
time:
  - platform: homeassistant
    id: homeassistant_time

# MQTT Integration (Home Assistant)
mqtt:
  id: mqtt0
  broker: !secret mqtt_broker_ip
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: lora/base-station

interval:
  - interval: 24h
    startup_delay: 20s
    then:
      - mqtt.publish:
          topic: "homeassistant/binary_sensor/mailbox_hatch/config"
          payload: >-
            {"name":"LoRa Mailbox Hatch","state_topic":"lora/mailbox","value_template":"{{ value_json.hatch }}","device_class":"door","payload_on":"true","payload_off":"false","unique_id":"mailbox_hatch","device":{"identifiers":["lora-base-station"],"manufacturer":"Heltec","name":"LoRa Base Station"}}
          retain: true
      - mqtt.publish:
          topic: "homeassistant/binary_sensor/mailbox_door/config"
          payload: >-
            {"name":"LoRa Mailbox Door","state_topic":"lora/mailbox","value_template":"{{ value_json.door }}","device_class":"door","payload_on":"true","payload_off":"false","unique_id":"mailbox_door","device":{"identifiers":["lora-base-station"],"manufacturer":"Heltec","name":"LoRa Base Station"}}
          retain: true
      - mqtt.publish:
          topic: "homeassistant/sensor/mailbox_battery/config"
          payload: >-
            {"name":"LoRa Mailbox Battery","state_topic":"lora/mailbox","value_template":"{{ value_json.battery }}","unit_of_measurement":"%","unique_id":"mailbox_battery","device":{"identifiers":["lora-base-station"],"manufacturer":"Heltec","name":"LoRa Base Station"}}
          retain: true
      - mqtt.publish:
          topic: "homeassistant/sensor/mailbox_rssi/config"
          payload: >-
            {"name":"LoRa Mailbox RSSI","state_topic":"lora/mailbox","value_template":"{{ value_json.rssi }}","unit_of_measurement":"dBm","unique_id":"mailbox_rssi","device":{"identifiers":["lora-base-station"],"manufacturer":"Heltec","name":"LoRa Base Station"}}
          retain: true
      - mqtt.publish:
          topic: "homeassistant/sensor/mailbox_snr/config"
          payload: >-
            {"name":"LoRa Mailbox SNR","state_topic":"lora/mailbox","value_template":"{{ value_json.snr }}","unit_of_measurement":"dB","unique_id":"mailbox_snr","device":{"identifiers":["lora-base-station"],"manufacturer":"Heltec","name":"LoRa Base Station"}}
          retain: true
