# Heltec WiFi LoRa 32 V3 - Lora Base Station LoRa Gateway
# Receives CubeCell mailbox sensor packets
# Integrates with Home Assistant MQTT

esphome:
  name: lora-base-station
  friendly_name: Lora Base Station
  # Turn it off at boot
  on_boot:
    then:
      - output.turn_off: onboard_led

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Fallback hotspot (for setup)
  ap:
    ssid: !secret fallback_wifi_ssid
    password: !secret fallback_wifi_password

# Captive portal for WiFi setup
captive_portal:

# OTA Updates
ota:
  - platform: esphome
    password: !secret ota_password

# API for Home Assistant
api:
  encryption:
    key: !secret api_encryption_key

logger:
  level: DEBUG  # Set to INFO after testing
  hardware_uart: UART0
  baud_rate: 115200

# SPI Bus for SX1262 LoRa
spi:
  id: spi0
  clk_pin: GPIO9      # SCK
  mosi_pin: GPIO10    # MOSI
  miso_pin: GPIO11    # MISO

# SX1262 LoRa Configuration (MATCHES CUBECELL)
sx126x:
  id: lora_radio
  spi_id: spi0
  cs_pin: GPIO8       # Chip Select
  dio1_pin: GPIO14    # DIO1 (IRQ)
  rst_pin: GPIO12     # Reset
  busy_pin: GPIO13    # Busy
  frequency: 868MHz   # 868 MHz (Italy)
  hw_version: sx1262  # Hardware version (REQUIRED)
  modulation: LORA    # LoRa modulation (REQUIRED)
  rf_switch: false     # DIO2 controls RF switch (REQUIRED)
  bandwidth: 125_0kHz # 125 kHz (matches CubeCell)
  spreading_factor: 8 # SF8 (matches CubeCell)
  coding_rate: CR_4_8 # CR4/8 (matches CubeCell)
  preamble_size: 8    # Preamble size (MUST match CubeCell!)
  sync_value: [0x14, 0x24]  # Private network sync word (explicitly set to match CubeCell)
  pa_power: 21        # Power amplifier setting
  rx_start: true      # Start receiver on boot
  crc_enable: true    # Enable CRC checking
  payload_length: 0   # Variable length packets (explicit header)
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  
  # Packet receive handler
  on_packet:
    then:
      - lambda: |-
          ESP_LOGD("lora", "Packet received: size=%d RSSI=%.1f dBm SNR=%.1f dB", x.size(), rssi, snr);
          bool hatch_open;
          bool door_open;
          uint8_t battery;
          // CubeCell packet format: [ID=0x01][Type=0x01][Hatch][Door][Battery]
          if (x.size() >= 5 && x[0] == 0x01 && x[1] == 0x01) {
            hatch_open = x[2];
            door_open = x[3];
            battery = x[4];
            
            // Log received packet
            ESP_LOGD("lora", "Lora Base Station: Hatch=%s Door=%s Batt=%d%% RSSI=%.1fdBm SNR=%.1fdB", 
                     hatch_open ? "OPEN" : "CLOSED",
                     door_open ? "OPEN" : "CLOSED", 
                     battery, rssi, snr);
            
            // MQTT publish — combined JSON (booleans for hatch/door)
            id(mqtt0).publish("lora/mailbox", str_sprintf(
              "{\"hatch\":%s,\"door\":%s,\"battery\":%d,\"rssi\":%.1f,\"snr\":%.1f}",
              hatch_open ? "true" : "false",
              door_open ? "true" : "false",
              battery, rssi, snr).c_str());
          } else {
            // Log unknown packet
            ESP_LOGW("lora", "Unknown packet received (size=%d)", x.size());
          }

          // Update Home Assistant entities
          id(mailbox_hatch_state) = hatch_open;
          id(mailbox_door_state) = door_open;
          id(mailbox_battery_state) = battery;
          id(mailbox_rssi_state) = rssi;
          id(mailbox_snr_state) = snr;

          id(mailbox_hatch).publish_state(hatch_open);
          id(mailbox_door).publish_state(door_open);
          id(mailbox_battery).publish_state(battery);
          id(mailbox_rssi).publish_state(rssi);
          id(mailbox_snr).publish_state(snr);

# Home Assistant entities (API)
binary_sensor:
  - platform: template
    name: "LoRa Mailbox Hatch"
    id: mailbox_hatch
    device_class: door
    lambda: "return id(mailbox_hatch_state);"
  - platform: template
    name: "LoRa Mailbox Door"
    id: mailbox_door
    device_class: door
    lambda: "return id(mailbox_door_state);"

sensor:
  - platform: template
    name: "LoRa Mailbox Battery"
    id: mailbox_battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: "return id(mailbox_battery_state);"
  - platform: template
    name: "LoRa Mailbox RSSI"
    id: mailbox_rssi
    unit_of_measurement: "dBm"
    accuracy_decimals: 1
    lambda: "return id(mailbox_rssi_state);"
  - platform: template
    name: "LoRa Mailbox SNR"
    id: mailbox_snr
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    lambda: "return id(mailbox_snr_state);"

globals:
  - id: mailbox_hatch_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: mailbox_door_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: mailbox_battery_state
    type: int
    restore_value: no
    initial_value: '0'
  - id: mailbox_rssi_state
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: mailbox_snr_state
    type: float
    restore_value: no
    initial_value: '0.0'

# Time for logging
time:
  - platform: homeassistant
    id: homeassistant_time

# MQTT Integration (Home Assistant)
mqtt:
  id: mqtt0
  broker: !secret mqtt_broker_ip
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: lora/base-station

